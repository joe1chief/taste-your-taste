<svg xmlns="http://www.w3.org/2000/svg" width="540" height="310" viewBox="0 0 540 310" fill="none" role="img" aria-label="Developer Code DNA Card for @joe1chief">
  <defs>
    <clipPath id="dnaClip"><rect x="0.5" y="0.5" width="539" height="309" rx="14"/></clipPath>
    <linearGradient id="dnaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="55%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="dnaRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dnaGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.06"/>
      <circle cx="18" cy="18" r="0.8" fill="#e2e8f0" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <g clip-path="url(#dnaClip)">
    <rect width="540" height="310" fill="url(#dnaBg)"/>
    <rect width="540" height="310" fill="url(#dnaGrid)"/>
    <rect width="540" height="34" fill="#080c17" fill-opacity="0.92"/>
    <line x1="0" y1="34" x2="540" y2="34" stroke="#1e293b"/>
    <rect y="280" width="540" height="30" fill="#080c17" fill-opacity="0.94"/>
    <line x1="0" y1="280" x2="540" y2="280" stroke="#1e293b"/>
  </g>

  <rect x="0.6" y="0.6" width="538.8" height="308.8" rx="14" stroke="url(#dnaRim)" stroke-width="1.2"/>

  <!-- Titlebar -->
  <g transform="translate(16, 11)">
    <circle cx="5" cy="6" r="4" fill="#ff5f56" fill-opacity="0.85"/>
    <circle cx="17" cy="6" r="4" fill="#ffbd2e" fill-opacity="0.85"/>
    <circle cx="29" cy="6" r="4" fill="#27c93f" fill-opacity="0.85"/>
    <text x="50" y="10" class="mono" font-size="11" font-weight="700" fill="#94a3b8">~/dna-sequencer/<tspan fill="#f8fafc">@joe1chief</tspan><tspan fill="#64748b"> (taste-your-taste)</tspan></text>
    <text x="508" y="10" text-anchor="end" class="mono" font-size="9.5" font-weight="700" fill="#22d3ee">GENOME:0xA4410E</text>
  </g>

  <!-- Genotype MBTI Banner -->
  <g transform="translate(22, 48)">
    <rect width="496" height="48" rx="8" fill="#0c1324" stroke="#f43f5e" stroke-opacity="0.45"/>
    <rect x="10" y="9" width="68" height="30" rx="5" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e"/>
    <text x="44" y="29" text-anchor="middle" class="mono" font-size="15" font-weight="800" fill="#f43f5e" letter-spacing="1.5">STPZ</text>
    <text x="90" y="23" class="sans" font-size="13" font-weight="800" fill="#f8fafc">INTJ-A // Surgical Stdlib Purist</text>
    <text x="90" y="39" class="mono" font-size="9.5" font-weight="600" fill="#94a3b8">NIGHT OWL (71% late-night commits)</text>
  </g>

  <!-- Stacked 100% Genome Spectrum Bar -->
  <g transform="translate(22, 108)">
    <text x="0" y="9" class="mono" font-size="8.5" font-weight="700" fill="#f43f5e" letter-spacing="1.1">01 // MASTER DEVELOPER SIMILARITY SPECTRUM</text>
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="258" height="12" rx="3" fill="#38bdf8"/>
      <rect x="260" y="0" width="122" height="12" rx="3" fill="#10b981"/>
      <rect x="384" y="0" width="112" height="12" rx="3" fill="#a855f7"/>
    </g>
  </g>

  <!-- Top 3 Archetype Rows -->
  <g transform="translate(22, 146)">
    <g transform="translate(0, 0)">
      <circle cx="6" cy="9" r="4.5" fill="#38bdf8"/>
      <text x="18" y="13" class="mono" font-size="11.5" font-weight="800" fill="#f8fafc">52%</text>
      <text x="54" y="13" class="sans" font-size="12" font-weight="700" fill="#38bdf8">Karpathy</text>
      <text x="128" y="13" class="mono" font-size="10.5" fill="#94a3b8">Single-File Minimalist</text>
      <rect x="336" y="4" width="160" height="9" rx="4.5" fill="#131c2e"/>
      <rect x="336" y="4" width="78" height="9" rx="4.5" fill="#38bdf8"/>
    </g>
    <g transform="translate(0, 30)">
      <circle cx="6" cy="9" r="4.5" fill="#10b981"/>
      <text x="18" y="13" class="mono" font-size="11.5" font-weight="800" fill="#f8fafc">25%</text>
      <text x="54" y="13" class="sans" font-size="12" font-weight="700" fill="#10b981">Antfu</text>
      <text x="128" y="13" class="mono" font-size="10.5" fill="#94a3b8">Strict Type Purist</text>
      <rect x="336" y="4" width="160" height="9" rx="4.5" fill="#131c2e"/>
      <rect x="336" y="4" width="38" height="9" rx="4.5" fill="#10b981"/>
    </g>
    <g transform="translate(0, 60)">
      <circle cx="6" cy="9" r="4.5" fill="#a855f7"/>
      <text x="18" y="13" class="mono" font-size="11.5" font-weight="800" fill="#f8fafc">23%</text>
      <text x="54" y="13" class="sans" font-size="12" font-weight="700" fill="#a855f7">Stripe</text>
      <text x="128" y="13" class="mono" font-size="10.5" fill="#94a3b8">Industrial Architect</text>
      <rect x="336" y="4" width="160" height="9" rx="4.5" fill="#131c2e"/>
      <rect x="336" y="4" width="35" height="9" rx="4.5" fill="#a855f7"/>
    </g>
  </g>

  <!-- 4 Measured Repo Telemetry Chips -->
  <g transform="translate(22, 242)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#0b1120" stroke="#1e293b"/>
    <text x="59" y="16.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#cbd5e1">COMMITS: <tspan fill="#22d3ee">77</tspan></text>

    <rect x="126" y="0" width="124" height="26" rx="5" fill="#0b1120" stroke="#1e293b"/>
    <text x="188" y="16.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#cbd5e1">DEPS: <tspan fill="#10b981">0 (STDLIB)</tspan></text>

    <rect x="258" y="0" width="118" height="26" rx="5" fill="#0b1120" stroke="#1e293b"/>
    <text x="317" y="16.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#cbd5e1">FN LOC: <tspan fill="#f59e0b">~17</tspan></text>

    <rect x="384" y="0" width="112" height="26" rx="5" fill="#0b1120" stroke="#1e293b"/>
    <text x="440" y="16.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#cbd5e1">TESTS: <tspan fill="#c084fc">15%</tspan></text>
  </g>

  <!-- Footer -->
  <g transform="translate(18, 299)">
    <text x="0" y="0" class="mono" font-size="10.5" font-weight="700" fill="#f43f5e">❯</text>
    <text x="12" y="0" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">npx taste-code dna --write</text>
    <text x="504" y="0" text-anchor="end" class="mono" font-size="9" font-weight="800" fill="#f43f5e" letter-spacing="1.2">CODE GENOME WRAPPED</text>
  </g>
</svg>