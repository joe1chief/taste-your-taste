<svg xmlns="http://www.w3.org/2000/svg" width="267" height="28" viewBox="0 0 267 28" fill="none" role="img" aria-label="TASTE: 94/100 · Chef's Taste">
  <defs>
    <clipPath id="badgeClip">
      <rect x="0.5" y="0.5" width="266" height="27" rx="6"/>
    </clipPath>
    <linearGradient id="badgeRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="valTint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <style>
    .b-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, monospace; }
    .b-key { font-size: 10.2px; font-weight: 800; fill: #e2e8f0; letter-spacing: 0.7px; }
    .b-val { font-size: 10.8px; font-weight: 700; fill: #10b981; }
  </style>

  <g clip-path="url(#badgeClip)">
    <!-- Left Key Segment -->
    <rect x="0" y="0" width="267" height="28" fill="#05070e"/>
    <!-- Angled Cyber Right Segment -->
    <polygon points="75,0 267,0 267,28 67,28" fill="#0a0f1d"/>
    <polygon points="75,0 267,0 267,28 67,28" fill="url(#valTint)"/>
    <!-- Angled Slash Divider -->
    <line x1="75" y1="0" x2="67" y2="28" stroke="#10b981" stroke-opacity="0.55" stroke-width="1.2"/>
  </g>

  <!-- Outer Precision Border -->
  <rect x="0.5" y="0.5" width="266" height="27" rx="6" stroke="url(#badgeRim)" stroke-width="1.1"/>

  <!-- Left Vector Terminal Prompt Icon + Node -->
  <g transform="translate(9, 8)">
    <rect x="0" y="0" width="14" height="12" rx="2.5" fill="#0c1324" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M 3.2 3.5 L 6.2 6 L 3.2 8.5 M 7.4 8.5 H 10.6" stroke="#f43f5e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Key Label -->
  <text x="28" y="17.8" class="b-mono b-key">TASTE</text>

  <!-- Value Readout -->
  <text x="80" y="17.8" class="b-mono b-val">94/100 · Chef's Taste</text>

  <!-- 5-Bar Signal Equalizer -->
  <rect x="237.0" y="14" width="2.8" height="5" rx="0.8" fill="#10b981" fill-opacity="0.95"/>
  <rect x="241.5" y="12" width="2.8" height="7" rx="0.8" fill="#10b981" fill-opacity="0.95"/>
  <rect x="246.0" y="10" width="2.8" height="9" rx="0.8" fill="#10b981" fill-opacity="0.95"/>
  <rect x="250.5" y="8" width="2.8" height="11" rx="0.8" fill="#10b981" fill-opacity="0.95"/>
  <rect x="255.0" y="6" width="2.8" height="13" rx="0.8" fill="#10b981" fill-opacity="0.95"/>
</svg>