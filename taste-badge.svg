<svg xmlns="http://www.w3.org/2000/svg" width="256" height="28" viewBox="0 0 256 28" fill="none">
  <defs>
    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <style>
    .badge-label { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #cbd5e1; letter-spacing: 0.5px; }
    .badge-val { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #10b981; }
  </style>

  <!-- Outer Container Box -->
  <rect x="0.5" y="0.5" width="255" height="27" rx="6" fill="#090d16" stroke="url(#badgeBorderGrad)"/>

  <!-- Left Label Background -->
  <path d="M 1 6.5 C 1 3.5 3.5 1 6.5 1 L 76 1 L 76 27 L 6.5 27 C 3.5 27 1 24.5 1 21.5 Z" fill="url(#labelBg)"/>

  <!-- Divider Line -->
  <line x1="76" y1="1" x2="76" y2="27" stroke="#334155" stroke-width="1"/>

  <!-- Right Value Background Tint -->
  <path d="M 76 1 L 249.5 1 C 252.5 1 255 3.5 255 6.5 L 255 21.5 C 255 24.5 252.5 27 249.5 27 L 76 27 Z" fill="rgba(16, 185, 129, 0.14)"/>

  <!-- Left Content: Icon & Label -->
  <g transform="translate(10, 18)">
    <text x="0" y="0" font-size="12">🍷</text>
    <text x="18" y="-1" class="badge-label">TASTE</text>
  </g>

  <!-- Right Content: Value -->
  <g transform="translate(88, 17)">
    <text x="0" y="0" class="badge-val">94 / 100 • Chef's Taste</text>
  </g>
</svg>