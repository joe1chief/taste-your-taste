name: Tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'bin/**'
      - 'registry/**'
      - 'test/**'
      - 'docs/**'
      - 'data/**'
      - 'discovered/**'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/tests.yml'
      - '.github/workflows/radar.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'bin/**'
      - 'registry/**'
      - 'test/**'
      - 'docs/**'
      - 'data/**'
      - 'discovered/**'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/tests.yml'
      - '.github/workflows/radar.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Radar and Catalog
        run: python3 -m unittest discover -s test -p "test_*.py"
      - name: Check Generated Catalog
        run: python3 scripts/build_catalog.py --check
      - name: Test Gallery Filtering
        run: node --test test/gallery.test.js
      - name: Test CLI
        run: npm test
