<svg xmlns="http://www.w3.org/2000/svg" width="540" height="220" viewBox="0 0 540 220" fill="none" role="img" aria-label="Taste Your Taste Telemetry Card for @joe1chief">
  <defs>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="539" height="219" rx="14"/>
    </clipPath>

    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="52%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="rimBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="laserTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="25%" stop-color="#f43f5e" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gaugeArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <radialGradient id="nebulaRight" cx="84%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaLeft" cx="14%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="blueprintGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.06"/>
      <path d="M 18 16.5 V 19.5 M 16.5 18 H 19.5" stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.1"/>
    </pattern>

    <pattern id="crtScanline" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="1" fill="#ffffff" fill-opacity="0.018"/>
    </pattern>

    <filter id="arcGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .chrome-path { font-size: 11px; font-weight: 600; fill: #94a3b8; }
    .chrome-user { font-size: 11px; font-weight: 700; fill: #f8fafc; }
    .telemetry-tag { font-size: 9.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
    .sec-idx { font-size: 8.5px; font-weight: 700; fill: #f43f5e; letter-spacing: 1.1px; }
    .sec-lbl { font-size: 8.5px; font-weight: 700; fill: #64748b; letter-spacing: 1.1px; }
    .arch-name { font-size: 12px; font-weight: 800; fill: #38bdf8; letter-spacing: 0.3px; }
    .chip-code { font-size: 10.5px; font-weight: 600; }
    .metric-key { font-size: 9px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.6px; }
    .metric-val { font-size: 9px; font-weight: 700; fill: #cbd5e1; }
    .score-num { font-size: 25px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
    .score-max { font-size: 9.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.6px; }
    .verdict-lbl { font-size: 9.5px; font-weight: 800; fill: #10b981; letter-spacing: 0.9px; }
    .footer-cmd { font-size: 10px; font-weight: 500; fill: #cbd5e1; }
    .footer-brand { font-size: 9px; font-weight: 800; fill: #f43f5e; letter-spacing: 1.2px; }

    @keyframes cursorBlink {
      0%, 49% { opacity: 0.9; }
      50%, 100% { opacity: 0.15; }
    }
    @keyframes radarPulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.9; }
    }
    .cursor-blk { animation: cursorBlink 1.2s infinite; }
    .led-pulse { animation: radarPulse 2.2s infinite ease-in-out; }
  </style>

  <!-- Clipped Interior Layers -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="540" height="220" fill="url(#bgCanvas)"/>
    <rect x="0" y="0" width="540" height="220" fill="url(#nebulaRight)"/>
    <rect x="0" y="0" width="540" height="220" fill="url(#nebulaLeft)"/>
    <rect x="0" y="0" width="540" height="220" fill="url(#blueprintGrid)"/>
    <rect x="0" y="0" width="540" height="220" fill="url(#crtScanline)"/>

    <!-- Top Terminal Window Chrome -->
    <rect x="0" y="0" width="540" height="33" fill="#080c17" fill-opacity="0.9"/>
    <line x1="0" y1="33" x2="540" y2="33" stroke="#1e293b" stroke-width="1"/>
    <line x1="40" y1="1" x2="500" y2="1" stroke="url(#laserTop)" stroke-width="1.5"/>

    <!-- Bottom CLI Prompt Strip -->
    <rect x="0" y="191" width="540" height="29" fill="#080c17" fill-opacity="0.92"/>
    <line x1="0" y1="191" x2="540" y2="191" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Outer Precision Frame & Inner Specular Rim -->
  <rect x="1.5" y="1.5" width="537" height="217" rx="13" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <rect x="0.6" y="0.6" width="538.8" height="218.8" rx="14" stroke="url(#rimBorder)" stroke-width="1.2"/>

  <!-- Corner HUD Reticle Brackets -->
  <path d="M 9 42 L 9 37 L 14 37" stroke="#f43f5e" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M 531 42 L 531 37 L 526 37" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M 9 182 L 9 187 L 14 187" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M 531 182 L 531 187 L 526 187" stroke="#f43f5e" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="square"/>

  <!-- ================= 1. TERMINAL TITLEBAR CHROME ================= -->
  <g transform="translate(16, 11)">
    <circle cx="5" cy="5.5" r="4" fill="#ff5f56" fill-opacity="0.82"/>
    <circle cx="17" cy="5.5" r="4" fill="#ffbd2e" fill-opacity="0.82"/>
    <circle cx="29" cy="5.5" r="4" fill="#27c93f" fill-opacity="0.82"/>

    <text x="52" y="9.5" class="mono">
      <tspan class="chrome-path">~/taste-dna/</tspan><tspan class="chrome-user">@joe1chief</tspan>
    </text>
    <rect x="209" y="0.5" width="6" height="10.5" rx="1" fill="#f43f5e" class="cursor-blk"/>
  </g>

  <!-- Right Telemetry Signature & Live Status Pill -->
  <g transform="translate(344, 7)">
    <text x="0" y="13.5" class="mono telemetry-tag">SIG:0x29F95E</text>
    <g transform="translate(86, 0)">
      <rect x="0" y="0" width="94" height="19" rx="9.5" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.38)" stroke-width="1"/>
      <circle cx="11" cy="9.5" r="4.5" fill="#10b981" class="led-pulse"/>
      <circle cx="11" cy="9.5" r="2.3" fill="#34d399"/>
      <text x="20" y="12.8" class="mono" font-size="8.5" font-weight="700" fill="#34d399" letter-spacing="0.6">VERIFIED</text>
    </g>
  </g>

  <!-- ================= 2. LEFT TELEMETRY DECK ================= -->
  <!-- Section 01: Archetype -->
  <g transform="translate(22, 46)">
    <text x="0" y="8" class="mono">
      <tspan class="sec-idx">01</tspan><tspan class="sec-lbl"> // ENGINEERING ARCHETYPE</tspan>
    </text>
    <g transform="translate(0, 14)">
      <rect x="0" y="0" width="188" height="26" rx="6" fill="rgba(56, 189, 248, 0.11)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1"/>
      <rect x="0" y="4" width="2.5" height="18" rx="1" fill="#38bdf8"/>
      <g transform="translate(10, 6)">
        <path d="M7 1L13 7L7 13L1 7L7 1ZM7 4.2L4.2 7L7 9.8L9.8 7L7 4.2Z" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="30" y="17" class="sans arch-name">Anti-Slop Minimalist</text>
    </g>
  </g>

  <!-- Section 02: Vibe Stacking Pipeline -->
  <g transform="translate(22, 98)">
    <text x="0" y="8" class="mono">
      <tspan class="sec-idx">02</tspan><tspan class="sec-lbl"> // TASTE STACKING DNA</tspan>
    </text>
    <g transform="translate(0, 14)">
      <!-- Style Module -->
      <rect x="0" y="0" width="109" height="24" rx="5" fill="#0c1324" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="109" height="24" rx="5" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1"/>
      <text x="10" y="15.5" class="mono chip-code" fill="#22d3ee">--style antfu</text>

      <!-- Circuit Trace Connector -->
      <line x1="109" y1="12" x2="131" y2="12" stroke="#475569" stroke-width="1.2" stroke-dasharray="2 2"/>
      <circle cx="120" cy="12" r="3.5" fill="#0a0f1d" stroke="#f43f5e" stroke-width="1.2"/>

      <!-- Tone Module -->
      <g transform="translate(131, 0)">
        <rect x="0" y="0" width="122" height="24" rx="5" fill="#0c1324" stroke="#1e293b" stroke-width="1"/>
        <rect x="0" y="0" width="122" height="24" rx="5" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1"/>
        <text x="10" y="15.5" class="mono chip-code" fill="#e9d5ff">--tone karpathy</text>
      </g>
    </g>
  </g>

  <!-- Section 03: Segmented Guardrail Equalizer -->
  <g transform="translate(22, 149)">
    <text x="0" y="9" class="mono metric-key">SIGNAL</text>
    <rect x="44.0" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="51.2" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="58.4" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="65.6" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="72.8" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="80.0" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="87.2" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="94.4" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="101.6" y="2.5" width="5" height="6" rx="1.1" fill="#10b981" fill-opacity="0.94"/><rect x="108.8" y="2.5" width="5" height="6" rx="1.1" fill="#162033" fill-opacity="0.85"/>
    <text x="122" y="9" class="mono metric-val">94%</text>

    <text x="160" y="9" class="mono metric-key">ARMOR</text>
    <rect x="200.0" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="207.2" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="214.4" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="221.6" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="228.8" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="236.0" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="243.2" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="250.4" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="257.6" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/><rect x="264.8" y="2.5" width="5" height="6" rx="1.1" fill="#22d3ee" fill-opacity="0.94"/>
    <text x="278" y="9" class="mono metric-val">ON</text>

    <text x="0" y="25" class="mono" font-size="9.5" font-weight="600" fill="#10b981">0% POLITENESS TAX</text>
    <text x="112" y="25" class="mono" font-size="9.5" fill="#64748b">•</text>
    <text x="122" y="25" class="mono" font-size="9.5" font-weight="600" fill="#94a3b8">DIFF-FIRST CONTRACT</text>
    <text x="242" y="25" class="mono" font-size="9.5" fill="#64748b">•</text>
    <text x="252" y="25" class="mono" font-size="9.5" font-weight="700" fill="#f43f5e">TIER::S+</text>
  </g>

  <!-- Vertical Telemetry Bus Divider -->
  <line x1="340" y1="44" x2="340" y2="181" stroke="#1e293b" stroke-width="1"/>
  <circle cx="340" cy="72" r="2" fill="#f43f5e" fill-opacity="0.7"/>
  <circle cx="340" cy="152" r="2" fill="#22d3ee" fill-opacity="0.7"/>

  <!-- ================= 3. RIGHT REACTOR GAUGE & LINUS VERDICT ================= -->
  <g transform="translate(440, 100)">
    <!-- Outer Precision Degree Ticks -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="1.5 6.35" opacity="0.75"/>
    <!-- Inner Counter-Ring -->
    <circle cx="0" cy="0" r="30.5" fill="none" stroke="#22d3ee" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.28"/>
    <!-- Main Gauge Track -->
    <circle cx="0" cy="0" r="39" fill="none" stroke="#131c2e" stroke-width="6.5"/>
    <!-- Illuminated Value Arc -->
    <circle cx="0" cy="0" r="39" fill="none" stroke="url(#gaugeArc)" stroke-width="6.5"
            stroke-linecap="round" stroke-dasharray="245.04" stroke-dashoffset="14.70"
            transform="rotate(-90)" filter="url(#arcGlow)"/>

    <!-- Center Readout -->
    <text x="0" y="3" text-anchor="middle" class="mono score-num">94</text>
    <text x="0" y="16" text-anchor="middle" class="mono score-max">/ 100</text>
  </g>

  <!-- Linus Audit Verdict Stamp -->
  <g transform="translate(362, 157)">
    <rect x="0" y="0" width="156" height="24" rx="5" fill="rgba(16, 185, 129, 0.14)" stroke="rgba(16, 185, 129, 0.55)" stroke-width="1"/>
    <path d="M 5 5 L 5 19 M 151 5 L 151 19" stroke="#10b981" stroke-width="1.3" stroke-opacity="0.65"/>
    <text x="78" y="15.5" text-anchor="middle" class="mono verdict-lbl">CHEF'S TASTE</text>
  </g>

  <!-- ================= 4. FOOTER EXECUTABLE CLI BAR ================= -->
  <g transform="translate(18, 209)">
    <text x="0" y="0" class="mono" font-size="10.5" font-weight="700" fill="#f43f5e">❯</text>
    <text x="12" y="0" class="mono footer-cmd">npx taste-code blend --style antfu --tone karpathy</text>
    <text x="504" y="0" text-anchor="end" class="mono footer-brand">TASTE YOUR TASTE</text>
  </g>
</svg>